[Service]
# Preserve the embedded OPS/Core source and add bounded, dry-run-only policy API routes.
WorkingDirectory=/srv/codeblack/releases/core-api/ops-aegis-policy-20261011-1
Environment=PYTHONPATH=/srv/codeblack/releases/core-api/ops-aegis-policy-20261011-1/ops-src
ExecStart=
ExecStart=/srv/codeblack/releases/core-api/ops-status-center-embedded-20261011/venv/bin/python -m uvicorn code_black_core_api.app:app --host 127.0.0.1 --port 8000 --workers 1 --loop asyncio --http h11 --ws websockets-sansio --no-proxy-headers --no-access-log --limit-concurrency 100 --backlog 128 --timeout-keep-alive 5 --timeout-graceful-shutdown 20
