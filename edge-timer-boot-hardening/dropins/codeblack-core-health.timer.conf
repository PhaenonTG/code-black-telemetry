# Edge timer boot hardening 2026-09-29: re-anchor the boot-relative first trigger to timer ACTIVATION (same pattern as the six-timer recovery).
# Persistent=true restores LastTrigger from the previous boot; if the timer starts later than OnBootSec after boot, systemd treats
# OnBootSec as an already-fired one-shot and the recurring trigger has no base until the service has run once -> "elapsed" forever.
# NOTE: any empty assignment clears ALL schedule values, so the recurrence is re-declared. RandomizedDelaySec/Unit/Persistent are preserved.
[Timer]
OnBootSec=
OnActiveSec=2min
OnUnitActiveSec=15min
