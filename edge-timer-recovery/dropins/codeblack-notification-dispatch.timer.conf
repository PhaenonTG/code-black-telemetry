# Edge timer recovery 2026-09-29: re-anchor the boot-relative first trigger to timer ACTIVATION.
# Root cause: Persistent=true restores LastTrigger from the previous boot; when the timer is started later than OnBootSec
# after boot (slow/hard-reboot boot) systemd treats OnBootSec as an already-fired one-shot, and OnUnitActiveSec has no base
# until the service has run once this boot, so the timer sits in "elapsed" forever.
# NOTE: any empty assignment clears ALL schedule values, so OnUnitActiveSec is re-declared here.
[Timer]
OnBootSec=
OnActiveSec=50s
OnUnitActiveSec=60s
