<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Black Storm Overlay — v2</title>
  <!-- Mapbox GL JS -- same version classic.html already uses (workers/radar-relay's real
       NEXRAD tiles rendered as a raster layer). -->
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css"
    integrity="sha384-EP/H7vnAWQ5LW9GnEKFrWdLNFs5Ar50IJgtlPCBzA/mZRKZrR+/rMG5kXl5QNyCp" crossorigin="anonymous" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"
    integrity="sha384-ZMqM0SdLsq7rI9P0wS7ycsmyMZABQED4jFTBlrzUG5+eRlOZnZFEwT5vDaWWr0pQ" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --border: rgba(255,255,255,0.12);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.72);
      --accent: #ff2a2a;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --panel-bg: linear-gradient(180deg, rgba(12,12,15,0.84), rgba(12,12,15,0.64));
      --font-overlay: "Oswald", Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }

    /* ---- Bubble family: shared by the mid-bar ---- */
    .bubble {
      height: 88px;
      border-radius: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .bubble::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.85;
    }
    .alert-bubble .a-main { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
    .alert-bubble .a-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; white-space: nowrap; }

    /* ---- F layout: clock top-right, radar bottom-right, conditions bottom-left, mid-bar
       spans the gap between the two bottom panels. ---- */
    .panel {
      position: absolute;
      border-radius: 24px;
      background: #0b0c10;
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .panel::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; z-index: 2;
      background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.85;
    }
    .panel-head {
      position: absolute; top: 0; left: 0; right: 0; height: 57px; z-index: 1;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 18px 12px 18px;
      background: linear-gradient(180deg, rgba(12,12,15,0.78), rgba(12,12,15,0.58));
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .panel-title { font-size: 22px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    .radar-panel-f .radar-title { font-size: 22px; letter-spacing: 0.07em; }
    .live-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 999px; background: var(--accent);
      box-shadow: 0 0 8px rgba(255,42,42,0.6);
      animation: brandDotPulse 1.4s infinite ease-in-out;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes brandDotPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.82); } }
    .panel-sub { font-size: 21px; font-weight: 700; letter-spacing: 0.03em; color: var(--muted); white-space: nowrap; }

    .brand-clock-w { width: max-content; max-width: 440px; }
    .top-brand-f {
      top: 28px; left: 28px; height: 88px;
      display: flex; align-items: center; justify-content: center; padding: 0 22px;
    }
    .top-brand-f .brand-text { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; }
    .brand-dot {
      width: 14px; height: 14px; border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(255,42,42,0.55);
      flex: 0 0 auto;
      animation: brandDotPulse 1.4s infinite ease-in-out;
    }
    .top-brand-f .brand-title-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .top-brand-f .brand-title { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-brand-f .brand-sub { font-size: 21px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub.count-flash { animation: countFlash 0.6s ease-out; }
    @keyframes countFlash { 0% { color: var(--text); } 100% { color: var(--muted); } }

    .clock-pill {
      top: 28px; right: 28px;
      height: 88px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 22px;
    }
    .clock-pill .clock-time { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .clock-pill .clock-date { font-size: 21px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
    .clock-colon { transition: opacity 0.15s ease; }

    .wind-panel { top: auto; bottom: 28px; left: 28px; width: 460px; height: 300px; }
    .cond-grid {
      position: absolute; inset: 57px 0 0 0;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    }
    .cond-tile {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 12px;
      border-right: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cond-tile:nth-child(2n) { border-right: none; }
    .cond-tile:nth-child(n+3) { border-bottom: none; }
    .cond-tile .c-icon { width: 28px; height: 28px; color: var(--muted); flex: 0 0 auto; }
    .cond-tile .c-icon.accent { color: var(--accent); }
    .c-icon-temp.idle-pulse { animation: tempBreathe 1.3s ease-in-out; transform-origin: 50% 90%; }
    @keyframes tempBreathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.08); } }
    .c-icon-dew.idle-pulse { animation: iconFloodBob 1.3s ease-in-out; }
    .c-icon-wind.idle-pulse { animation: windLinesSway 1.1s ease-in-out; }
    @keyframes windLinesSway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(2.5px); } }
    .f-drop-icon { display: inline-block; animation: iconFloodBob 2.6s ease-in-out infinite; }
    .wind-twitch { animation: windTwitch 4.4s ease-in-out infinite; transform-origin: 50% 55%; }
    @keyframes windTwitch {
      0%   { transform: rotate(calc(var(--heading) + 0deg)); }
      9%   { transform: rotate(calc(var(--heading) - 3deg)); }
      17%  { transform: rotate(calc(var(--heading) + 2deg)); }
      26%  { transform: rotate(calc(var(--heading) - 1deg)); }
      35%  { transform: rotate(calc(var(--heading) + 4deg)); }
      47%  { transform: rotate(calc(var(--heading) - 2deg)); }
      60%  { transform: rotate(calc(var(--heading) + 1deg)); }
      73%  { transform: rotate(calc(var(--heading) - 4deg)); }
      86%  { transform: rotate(calc(var(--heading) + 2deg)); }
      100% { transform: rotate(calc(var(--heading) + 0deg)); }
    }
    .cond-tile .c-text { text-align: center; width: 112px; }
    .cond-tile .c-row { display: flex; align-items: baseline; gap: 8px; justify-content: center; }
    .cond-tile .c-val { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .cond-tile .c-val.cold { color: #7fb8ff; }
    .cond-tile .c-val.cool { color: #a8d4ff; }
    .cond-tile .c-val.warm { color: #ffb454; }
    .cond-tile .c-val.hot { color: #ff3b30; }
    .cond-tile .c-val.dry { color: #35d488; }
    .cond-tile .c-val.humid { color: #e8c93a; }
    .cond-tile .c-val.muggy { color: #ff8a4d; }
    .cond-tile .c-val.oppressive { color: #ff3b30; }
    .cond-tile .c-val.windy { color: #e8c93a; }
    .cond-tile .c-val.strong-wind { color: #ff8a4d; }
    .cond-tile .c-val.dangerous-wind { color: #ff3b30; }
    .cond-tile .c-val .c-unit { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 2px; }
    .cond-tile .c-lab { font-size: 21px; color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase; }
    .cond-tile .c-extra { font-size: 21px; color: var(--muted); }
    #condTempTile.heat-shimmer .c-val { animation: heatShimmerPulse 2.4s ease-in-out infinite; }
    @keyframes heatShimmerPulse { 0%, 100% { text-shadow: 0 0 0 rgba(255,102,0,0); } 50% { text-shadow: 0 0 16px rgba(255,102,0,0.6); } }

    .radar-panel-f { top: auto; bottom: 28px; right: 28px; width: 460px; height: 300px; }
    .radar-head {
      position: absolute; top: 0; left: 0; right: 0; height: 57px; z-index: 1;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 18px 12px 18px;
      background: linear-gradient(180deg, rgba(12,12,15,0.78), rgba(12,12,15,0.58));
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .radar-title-row { display: flex; align-items: baseline; gap: 10px; }
    .radar-title { font-size: 15px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
    .radar-live { font-size: 21px; letter-spacing: 0.03em; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .radar-body {
      position: absolute; inset: 57px 0 0 0;
      background: linear-gradient(155deg, #1c2b1f 0%, #14181c 55%, #0e1114 100%);
      transition: background 0.3s ease;
    }
    .radar-body.vel {
      background:
        radial-gradient(26% 34% at 58% 38%, rgba(30,220,90,0.85) 0%, rgba(30,220,90,0.35) 55%, transparent 75%),
        radial-gradient(26% 34% at 70% 42%, rgba(255,40,40,0.85) 0%, rgba(255,40,40,0.35) 55%, transparent 75%),
        radial-gradient(45% 40% at 64% 40%, rgba(255,204,0,0.12) 0%, transparent 70%),
        linear-gradient(155deg, #14181c 0%, #101316 55%, #0b0d10 100%);
    }
    /* Real Mapbox GL radar map, layered over .radar-body's gradient (visible only until the map
       loads, or if it never does). Ported from classic.html. */
    #radarMap { position: absolute; inset: 0; }
    .mapboxgl-ctrl-attrib {
      font-size: 8px !important;
      background: rgba(0,0,0,0.35) !important;
      color: rgba(255,255,255,0.35) !important;
      padding: 0 4px !important;
    }
    .mapboxgl-ctrl-attrib a { color: rgba(255,255,255,0.45) !important; }
    .mapboxgl-ctrl-logo { transform: scale(0.7); transform-origin: bottom left; opacity: 0.6; }
    .mapboxgl-ctrl-bottom-right .mapboxgl-ctrl { margin: 0 4px 2px 0 !important; }
    .mapboxgl-ctrl-bottom-left .mapboxgl-ctrl { margin: 0 0 2px 4px !important; }
    .radar-position-marker { position: relative; width: 16px; height: 16px; }
    .radar-position-marker__core {
      position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(255,42,42,0.85), 0 0 0 2px rgba(255,255,255,0.9);
    }
    .radar-position-marker__ring {
      position: absolute; inset: 0; border-radius: 999px; border: 2px solid var(--accent);
      animation: radarPositionPulse 1.6s infinite ease-out;
    }
    @keyframes radarPositionPulse { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
    .radar-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); background: #0b0c10; transition: opacity 0.3s ease; z-index: 2;
    }
    .radar-loading.hidden { opacity: 0; pointer-events: none; }

    .mid-bar {
      position: absolute; bottom: 28px; left: 502px; right: 502px;
      height: 150px; border-radius: 24px;
      display: flex; align-items: stretch; justify-content: center;
      padding: 0 6px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .mid-bar.is-alert { border-color: rgba(255,255,255,0.18); text-align: center; }
    .mid-bar.is-alert:not(.is-glass)::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 10px, transparent 10px 20px),
        radial-gradient(120% 100% at 50% 35%, transparent 55%, rgba(0,0,0,0.28) 100%);
    }
    .mid-bar.is-alert.is-glass { border-color: var(--glass-accent-55, rgba(255,255,255,0.18)); }
    .mid-bar.is-alert.is-glass .alert-icon-badge {
      background: var(--glass-accent-14, rgba(255,255,255,0.1));
      border-color: var(--glass-accent-40, rgba(255,255,255,0.3));
    }
    .mid-bar.is-alert.is-glass .alert-icon-badge svg { color: var(--glass-accent, #fff); }
    .mid-bar.is-alert.is-glass .a-main { text-shadow: none; }
    @keyframes alertBoxGlow {
      0%, 100% { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 var(--abg-r-soft, 8px) var(--abg-color, transparent); }
      50% { box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06), 0 0 var(--abg-r-strong, 22px) var(--abg-color, transparent); }
    }
    .mid-bar.is-alert.alert-box-glow { animation: alertBoxGlow 2.4s ease-in-out infinite; }
    .mid-bar .alert-inner { display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; gap: 16px; padding: 0 10px; position: relative; z-index: 1; }
    .alert-icon-badge {
      flex: 0 0 auto; width: 64px; height: 64px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .alert-icon-badge svg { width: 34px; height: 34px; color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
    .alert-icon-badge svg.icon-funnel { animation: iconFunnelSway 3.2s ease-in-out infinite; transform-origin: 50% 25%; }
    @keyframes iconFunnelSway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    .alert-icon-badge svg.icon-storm { animation: iconStormDrift 3.8s ease-in-out infinite; }
    @keyframes iconStormDrift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    .alert-icon-badge svg.icon-flood { animation: iconFloodBob 3s ease-in-out infinite; }
    @keyframes iconFloodBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    .alert-icon-badge svg.icon-sun { animation: iconSunShimmer 9s linear infinite; transform-origin: 50% 50%; }
    @keyframes iconSunShimmer { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .alert-icon-badge svg.icon-bell { animation: iconBellSway 3.4s ease-in-out infinite; transform-origin: 50% 15%; }
    @keyframes iconBellSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes lightningFlash {
      0%   { box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 0 rgba(255,255,255,0); }
      8%   { box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 40px 10px rgba(255,255,255,0.9); }
      16%  { box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 6px rgba(255,255,255,0.2); }
      24%  { box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 30px 6px rgba(255,255,255,0.7); }
      100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 0 0 rgba(255,255,255,0); }
    }
    .alert-icon-badge.lightning-flash { animation: lightningFlash 0.5s ease-out; }
    @keyframes justUpdatedFlash {
      0% { box-shadow: var(--shadow), 0 0 0 rgba(255,255,255,0); }
      30% { box-shadow: var(--shadow), 0 0 22px rgba(255,255,255,0.4); }
      100% { box-shadow: var(--shadow), 0 0 0 rgba(255,255,255,0); }
    }
    .just-updated { animation: justUpdatedFlash 0.6s ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .wind-twitch, .alert-icon-badge svg.icon-funnel, .alert-icon-badge svg.icon-storm,
      .alert-icon-badge svg.icon-flood, .alert-icon-badge svg.icon-sun, .alert-icon-badge svg.icon-bell,
      .f-icon-sun, .f-icon-partly, .f-icon-rain, .f-icon-cloudy, .f-icon-storm, .f-icon-snow,
      .f-icon-fog, .f-icon-windy, .f-icon-moon, .f-icon-partly-night,
      .alert-icon-badge.lightning-flash, .glyph-halo, .glyph-sweep::before, .g-blip, .g-you,
      #condTempTile.heat-shimmer .c-val, .just-updated, .brand-sub.count-flash,
      .c-icon-temp.idle-pulse, .c-icon-dew.idle-pulse, .c-icon-wind.idle-pulse,
      .spc-icon-tor, .spc-icon-wind, .spc-icon-hail, .params-verdict .pv-icon,
      .sm-icon-sunrise, .sm-icon-sunset, .sm-icon-daylight,
      .sm-icon-moon, .f-drop-icon { animation: none; }
    }
    .alert-text-col { display: flex; flex-direction: column; justify-content: center; gap: 3px; text-align: left; min-width: 0; max-width: 700px; }
    .a-main-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .mid-bar .a-sig-tag { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.4); }
    .mid-bar .a-main { font-size: 25px; font-weight: 800; letter-spacing: 0.01em; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,0.55); }
    .mid-bar .a-tags { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; justify-content: flex-start; }
    .mid-bar .a-tag {
      font-size: 19px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
      background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.32); border-radius: 6px;
      padding: 3px 11px; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .mid-bar .a-expires {
      font-size: 19px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.38); border-radius: 6px;
      padding: 3px 11px; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      display: inline-block; min-width: 118px; text-align: center;
    }
    .mid-bar .a-towns { font-size: 19px; font-weight: 600; opacity: 1; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
    .mid-bar .a-towns b { font-weight: 800; }
    .mid-bar .a-tags-plain { font-size: 19px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text); }
    .mid-bar .a-tags-plain .a-expires { background: none; border: none; padding: 0; text-shadow: none; display: inline-block; min-width: 96px; text-align: left; }

    .fx-panel.tier-glow { border-color: var(--tier-color, var(--border)); transition: border-color 0.4s ease, box-shadow 0.4s ease; }
    .fx-panel.tier-glow { box-shadow: var(--shadow), 0 0 26px var(--tier-glow-soft, transparent), inset 0 1px 0 rgba(255,255,255,0.06); }
    .fx-panel.tier-glow::before { background: linear-gradient(90deg, transparent, var(--tier-color, var(--accent)), transparent); opacity: 1; transition: background 0.4s ease; }
    .fx-panel.tier-pulse { animation: tierPulse 2.4s ease-in-out infinite; }
    @keyframes tierPulse {
      0%, 100% { box-shadow: var(--shadow), 0 0 var(--pulse-min, 14px) var(--pulse-color, rgba(255,0,0,0.25)), inset 0 1px 0 rgba(255,255,255,0.06); }
      50% { box-shadow: var(--shadow), 0 0 var(--pulse-max, 34px) var(--pulse-color, rgba(255,0,0,0.55)), inset 0 1px 0 rgba(255,255,255,0.06); }
    }

    /* ---- Params / Chasers / SPC / Forecast / Sun&Moon: still demo data, wired in a later
       phase -- markup/CSS kept identical to the mockup so those cards render correctly once
       their turn in the rotation comes up. ---- */
    .params-wrap { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .params-verdict {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 32px; margin: 8px 10px 0; border-radius: 8px; color: #14140f;
      font-size: 16px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    }
    .params-verdict .pv-icon { width: 17px; height: 17px; flex: 0 0 auto; animation: pvIconPulse 2.4s ease-in-out infinite; }
    @keyframes pvIconPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    .mid-bar .params-row { display: flex; align-items: stretch; width: 100%; flex: 1; min-height: 0; }
    .mid-bar .param { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 0 4px; min-width: 0; }
    .mid-bar .param + .param { border-left: 1px solid rgba(255,255,255,0.08); }
    .mid-bar .param .p-val { font-size: 29px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
    .mid-bar .param .p-unit { font-size: 13px; font-weight: 700; color: var(--muted); margin-left: 2px; }

    @keyframes glyphSweep { to { transform: rotate(360deg); } }
    .glyph-svg { position: relative; z-index: 1; width: 100%; height: 100%; }
    .g-ring { fill: none; stroke: rgba(255,255,255,0.26); stroke-width: 1; }
    .g-you { fill: var(--accent); animation: brandDotPulse 1.4s infinite ease-in-out; }

    @keyframes fCloudDrift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

    .forecast-day .f-hilo { font-size: 26px; font-weight: 800; white-space: nowrap; }
    .forecast-day .f-hilo .lo { color: var(--muted); font-weight: 700; margin-left: 4px; }
    .forecast-day .f-cond { font-size: 21px; color: var(--muted); white-space: normal; line-height: 1.25; margin-top: 3px; }
    .forecast-day .f-cond .drop { color: #7fb8ff; font-weight: 700; }

    .sm-stat .sm-icon.accent { color: var(--accent); }
    .sm-icon-sunrise { animation: smSunriseBob 3.2s ease-in-out infinite; }
    @keyframes smSunriseBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .sm-icon-sunset { animation: smSunsetGlow 3.2s ease-in-out infinite; }

    .sm-icon-daylight { animation: iconSunShimmer 10s linear infinite; transform-origin: 50% 50%; }
    .sm-icon-moon { animation: smMoonGlow 3.6s ease-in-out infinite; }
    @keyframes smMoonGlow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(220,220,255,0)); } 50% { filter: drop-shadow(0 0 5px rgba(220,220,255,0.85)); } }
    .sm-stat .sm-text { display: flex; flex-direction: column; gap: 1px; }

    .sm-stat .sm-lab { font-size: 21px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }

    /* ---- Real OBS-canvas reset, matching classic.html exactly (not the mockup gallery's
       padded/boxed page chrome) -- transparent full-bleed 1920x1080 canvas scaled to fit
       whatever window size OBS gives it. ---- */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: rgba(0,0,0,0);
      overflow: hidden;
      font-family: var(--font-overlay);
      color: var(--text);
    }
    .canvas {
      position: relative;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="canvas" id="canvas">
    <div class="panel top-brand-f brand-clock-w fx-panel">
      <div class="brand-text">
        <div class="brand-title-row"><div class="brand-dot"></div><div class="brand-title" id="brandTitle">Nick Mounce</div></div>
        <div class="brand-sub" id="viewerCount"></div>
      </div>
    </div>

    <div class="panel clock-pill brand-clock-w fx-panel">
      <div class="clock-time"><span class="clock-h">--</span><span class="clock-colon">:</span><span class="clock-m">--</span> <span class="clock-ampm"></span></div>
      <div class="clock-date"></div>
    </div>

    <div class="panel wind-panel fx-panel">
      <div class="panel-head">
        <div class="panel-title"><span id="condTitleText">Current · Awaiting GPS feed...</span></div>
        <div class="panel-sub"><span class="live-dot"></span>Live</div>
      </div>
      <div class="cond-grid" id="condGrid">
        <div class="cond-tile" id="condTempTile">
          <svg class="c-icon c-icon-temp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 14.5V5a2 2 0 1 0-4 0v9.5a4 4 0 1 0 4 0z"/><path d="M10 8h1M10 11h1"/></svg>
          <div class="c-text">
            <div class="c-row"><div class="c-val">--<span class="c-unit">°F</span></div></div>
            <div class="c-lab">Temp</div>
            <div class="c-extra">&nbsp;</div>
          </div>
        </div>
        <div class="cond-tile">
          <svg class="c-icon c-icon-dew" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 7 6 11.5a6 6 0 0 1-12 0C6 10 12 3 12 3z"/></svg>
          <div class="c-text">
            <div class="c-row"><div class="c-val">--<span class="c-unit">°F</span></div></div>
            <div class="c-lab">Dew Point</div>
            <div class="c-extra">&nbsp;</div>
          </div>
        </div>
        <div class="cond-tile">
          <svg class="c-icon c-icon-wind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h11a2.5 2.5 0 1 0-2.2-3.6"/><path d="M3 16h14a2.5 2.5 0 1 1-2.2 3.6"/><path d="M3 12h8a2 2 0 1 0-1.8-2.8"/></svg>
          <div class="c-text">
            <div class="c-row"><div class="c-val">--<span class="c-unit">mph</span></div></div>
            <div class="c-lab">Wind</div>
            <div class="c-extra">&nbsp;</div>
          </div>
        </div>
        <div class="cond-tile">
          <svg class="c-icon accent wind-twitch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="--heading:0deg;"><path d="M12 3l6 15-6-3-6 3z"/></svg>
          <div class="c-text">
            <div class="c-row"><div class="c-val">--</div></div>
            <div class="c-lab">Heading</div>
            <div class="c-extra">&nbsp;</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel radar-panel-f fx-panel">
      <div class="radar-head">
        <div class="radar-title-row"><div class="radar-title">Radar · <span id="radarModeText">REF</span></div></div>
        <div class="radar-live"><span class="live-dot"></span>Live</div>
      </div>
      <div class="radar-body" id="radarBody">
        <div id="radarMap"></div>
        <div class="radar-loading" id="radarLoading">Acquiring site...</div>
      </div>
    </div>

    <div class="bubble mid-bar" id="midBar"></div>
  </div>

  <script src="alert-feed.js"></script>
  <script>
    // ---- Settings: same URL-param convention classic.html already uses when embedded as an
    // OBS Browser Source (?latitude=/?longitude= manual override, ?pollSeconds=, ?unitId=,
    // etc.) -- see classic.html for the original. Conditions/Location-text rendering off this
    // position data is Phase 2 work; only the position acquisition itself is needed here since
    // Alerts (Phase 1) cannot query api.weather.gov without a point.
    const params = new URLSearchParams(window.location.search);
    const manualLatitude = params.get('latitude') ? Number(params.get('latitude')) : null;
    const manualLongitude = params.get('longitude') ? Number(params.get('longitude')) : null;
    const settings = {
      title: params.get('title') || params.get('publicIdentity') || 'Nick Mounce',
      latitude: manualLatitude,
      longitude: manualLongitude,
      bearingDeg: null,
      scaleToWindow: true,
      pollSeconds: params.get('pollSeconds') ? Number(params.get('pollSeconds')) : 60,
      useLiveGps: manualLatitude === null || manualLongitude === null,
      chaseGatewayBase: params.get('chaseGatewayBase') || 'https://ops.codeblackwx.com',
      unitId: params.get('unitId') || 'cbwx-unit-tessa',
      gpsPollSeconds: params.get('gpsPollSeconds') ? Number(params.get('gpsPollSeconds')) : 5,
      // "Nearby chasers" radius -- 25mi default per the locked decision, but configurable
      // without a code change (matches classic.html's existing settings-via-URL-param pattern).
      chaserRadiusMiles: params.get('chaserRadiusMiles') ? Number(params.get('chaserRadiusMiles')) : 25,
      // How far back a storm report still counts as "current" -- not specified by the ported
      // stormReports.ts service (it takes this as a caller-supplied argument); 3 hours is a new
      // default choice for this caller, also configurable.
      chaserReportRetentionHours: params.get('chaserReportRetentionHours') ? Number(params.get('chaserReportRetentionHours')) : 3,
    };
    let lastAppliedLat = manualLatitude;
    let lastAppliedLon = manualLongitude;
    let lastLocationName = null;
    document.getElementById('brandTitle').textContent = settings.title;

    // Live viewer count -- Facebook Live. This overlay never talks to Facebook's Graph API
    // directly (that needs a Page Access Token, a real secret that can't sit in client-side
    // code any more than the Mapbox token could -- see resolveMapboxToken above for the exact
    // same reasoning and the real incident that established it). It reads from a gateway
    // endpoint that does not exist yet: `${chaseGatewayBase}/overlay-core/facebook-viewers`,
    // expected to return `{ "count": <number> }` once a Worker route is deployed there holding
    // the real Page Access Token server-side. Until that route exists this fails silently and
    // the line stays blank -- no fabricated number, matching how every other feed in this file
    // behaves when its source isn't reachable.
    let lastViewerCount = null;
    async function updateViewerCount() {
      const el = document.getElementById('viewerCount');
      try {
        const url = `${settings.chaseGatewayBase}/overlay-core/facebook-viewers`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('viewer count fetch failed');
        const data = await res.json();
        const count = Number(data.count);
        if (!Number.isFinite(count)) throw new Error('viewer count missing');
        if (count !== lastViewerCount) {
          lastViewerCount = count;
          el.textContent = `${count.toLocaleString()} watching`;
          el.classList.remove('count-flash'); void el.offsetWidth; el.classList.add('count-flash');
        }
      } catch (err) {
        // leave last-known count in place (or blank, if none has ever loaded) -- never show a
        // fabricated number
      }
    }

    // Live position: chase phone -> chase-gateway Worker -> Core -> this public read. Ported
    // from classic.html's updateGps() -- see there for the full route/auth rationale.
    async function updateGps() {
      if (!settings.useLiveGps) return;
      try {
        const url = `${settings.chaseGatewayBase}/api/chase/location/public?unit_id=${encodeURIComponent(settings.unitId)}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('gps fetch failed');
        const data = await res.json();
        const hasFix = typeof data.lat === 'number' && typeof data.lon === 'number';
        if (!hasFix || data.stale || data.location_sharing === false) {
          settings.latitude = null;
          settings.longitude = null;
          settings.bearingDeg = null;
          lastAppliedLat = null;
          lastAppliedLon = null;
          document.getElementById('condTitleText').textContent = data.location_sharing === false ? 'Location sharing stopped' : 'Awaiting GPS feed...';
          renderConditions();
          return;
        }
        settings.bearingDeg = typeof data.bearing_deg === 'number' ? data.bearing_deg : null;
        settings.latitude = data.lat;
        settings.longitude = data.lon;
        renderConditions();
        const moved = lastAppliedLat === null
          || Math.abs(data.lat - lastAppliedLat) > 0.01
          || Math.abs(data.lon - lastAppliedLon) > 0.01;
        if (moved) {
          lastAppliedLat = data.lat;
          lastAppliedLon = data.lon;
          updateLocation();
          updateWeather();
          updateSurfaceObs();
          updateAlertReal();
          updateRadarSite();
          updateSpcOutlook();
          updateChaserData();
          updateForecast();
          updateStormIntel();
          updateNearbySevereWarnings();
        }
      } catch (err) {
        // leave last-known position in place -- a single missed GPS poll isn't an outage
      }
    }

    // Nominatim reverse geocode -- public, CORS-open, no key. Rate-limited to ~1req/s by their
    // usage policy; only called once per settings.pollSeconds (default 60s) plus on a
    // meaningful GPS position change, well under it. Ported from classic.html's updateLocation().
    async function updateLocation() {
      const titleEl = document.getElementById('condTitleText');
      if (settings.latitude === null || settings.longitude === null) {
        titleEl.textContent = 'Awaiting GPS feed...';
        return;
      }
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${settings.latitude}&lon=${settings.longitude}&zoom=10`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('reverse geocode failed');
        const data = await res.json();
        const addr = data.address || {};
        const city = addr.city || addr.town || addr.village || addr.hamlet || addr.county;
        const state = addr.state;
        lastLocationName = city && state ? `${city}, ${state.slice(0, 2).toUpperCase()}` : (data.display_name || 'Location unavailable');
      } catch (err) {
        lastLocationName = `${settings.latitude.toFixed(2)}, ${settings.longitude.toFixed(2)}`;
      }
      titleEl.textContent = `Current · ${lastLocationName}`;
    }

    // Open-Meteo -- public, CORS-open, no key. Fields beyond temp/dew point (wind speed/
    // direction/gusts, relative humidity, apparent temperature) are all on this same call --
    // one more field each, no new API -- matching the decision to add wind_speed_10m here
    // rather than integrate a separate wind data source.
    let lastTemp = null, lastFeels = null, lastDew = null, lastHumidity = null;
    let lastWindSpeed = null, lastWindDir = null, lastGust = null;
    async function updateWeather() {
      if (settings.latitude === null || settings.longitude === null) return;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${settings.latitude}&longitude=${settings.longitude}&current=temperature_2m,apparent_temperature,dew_point_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('weather fetch failed');
        const data = await res.json();
        const c = data.current;
        lastTemp = Math.round(c.temperature_2m);
        lastFeels = Math.round(c.apparent_temperature);
        lastDew = Math.round(c.dew_point_2m);
        lastHumidity = Math.round(c.relative_humidity_2m);
        lastWindSpeed = Math.round(c.wind_speed_10m);
        lastWindDir = c.wind_direction_10m;
        lastGust = Math.round(c.wind_gusts_10m);
        renderConditions();
      } catch (err) {
        // leave last-known weather in place -- a single missed poll isn't an outage
      }
    }

    // Ground truth surface obs -- a real METAR/ASOS station reading (api.weather.gov, public,
    // no key), preferred over Open-Meteo's gridded model estimate when present. Ported from
    // classic.html's updateSurfaceObs(); same nearest-station lookup (points -> station list
    // -> nearest by straight-line distance -> latest observation).
    let lastGroundObs = null;
    function approxMilesBetween(lat1, lon1, lat2, lon2) {
      const dLat = lat1 - lat2;
      const dLon = (lon1 - lon2) * Math.cos((lat1 * Math.PI) / 180);
      return Math.sqrt(dLat * dLat + dLon * dLon) * 69;
    }
    async function updateSurfaceObs() {
      if (settings.latitude === null || settings.longitude === null) return;
      try {
        const pointsRes = await fetch(`https://api.weather.gov/points/${settings.latitude.toFixed(4)},${settings.longitude.toFixed(4)}`, { headers: { Accept: 'application/geo+json' } });
        if (!pointsRes.ok) throw new Error('points lookup failed');
        const pointsData = await pointsRes.json();
        const stationsUrl = pointsData.properties && pointsData.properties.observationStations;
        if (!stationsUrl) throw new Error('no observationStations link');
        const stationsRes = await fetch(stationsUrl, { headers: { Accept: 'application/geo+json' } });
        if (!stationsRes.ok) throw new Error('stations list failed');
        const stationsData = await stationsRes.json();
        const features = stationsData.features || [];
        if (!features.length) throw new Error('no nearby stations');
        let nearest = null;
        let nearestMiles = Infinity;
        for (const f of features) {
          const coords = f.geometry && f.geometry.coordinates; // [lon, lat]
          if (!coords) continue;
          const miles = approxMilesBetween(settings.latitude, settings.longitude, coords[1], coords[0]);
          if (miles < nearestMiles) { nearestMiles = miles; nearest = f; }
        }
        if (!nearest) throw new Error('no usable station coordinates');
        const stationId = nearest.properties.stationIdentifier;
        const obsRes = await fetch(`https://api.weather.gov/stations/${stationId}/observations/latest`, { headers: { Accept: 'application/geo+json' } });
        if (!obsRes.ok) throw new Error('latest observation failed');
        const obsData = await obsRes.json();
        const p = obsData.properties || {};
        const tempC = p.temperature && p.temperature.value;
        const dewC = p.dewpoint && p.dewpoint.value;
        if (typeof tempC !== 'number' || typeof dewC !== 'number') throw new Error('observation missing temp/dewpoint');
        lastGroundObs = {
          stationId,
          tempF: Math.round((tempC * 9) / 5 + 32),
          dewF: Math.round((dewC * 9) / 5 + 32),
        };
        renderConditions();
      } catch (err) {
        // leave last-known ground obs in place -- always a supplement to updateWeather()'s
        // model estimate, never the only reading shown
      }
    }

    // SPC Day 1/2/3 Convective Outlook -- ported from the mobile app's src/services/
    // spcOutlook.ts (public, unauthenticated GeoJSON layers, no key). Point-in-polygon against
    // the caller's own position picks the single highest-applicable risk tier per layer; risk
    // polygons are nested (SLGT is its own shape, not "MRGL minus SLGT"), so the highest DN
    // among all matches is the real answer. Categorical color is SPC's own published fill hex
    // (props.fill), not a locally-invented mapping.
    const SPC_OUTLOOK_URLS = {
      '1-cat': 'https://www.spc.noaa.gov/products/outlook/day1otlk_cat.lyr.geojson',
      '1-torn': 'https://www.spc.noaa.gov/products/outlook/day1otlk_torn.lyr.geojson',
      '2-cat': 'https://www.spc.noaa.gov/products/outlook/day2otlk_cat.lyr.geojson',
      '2-torn': 'https://www.spc.noaa.gov/products/outlook/day2otlk_torn.lyr.geojson',
      '3-cat': 'https://www.spc.noaa.gov/products/outlook/day3otlk_cat.lyr.geojson',
    };
    const SPC_CACHE_MS = 10 * 60_000; // SPC reissues day1 a handful of times/day, day2/3 once or twice
    const spcCache = new Map();
    async function fetchSpcOutlook(url) {
      const cached = spcCache.get(url);
      if (cached && cached.expires > Date.now()) return cached.value;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      try {
        const res = await fetch(url, { signal: controller.signal, headers: { Accept: 'application/geo+json, application/json' } });
        if (!res.ok) throw new Error(String(res.status));
        const data = await res.json();
        const features = data.features || [];
        spcCache.set(url, { expires: Date.now() + SPC_CACHE_MS, value: features });
        return features;
      } finally {
        clearTimeout(timer);
      }
    }
    function spcPointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect = (yi > point.lat) !== (yj > point.lat) && point.lon < ((xj - xi) * (point.lat - yi)) / (yj - yi || 1e-9) + xi;
        if (intersect) inside = !inside;

    }
    function spcPointInGeometry(point, geometry) {
      if (!geometry) return false;

      if (geometry.type === 'MultiPolygon') return geometry.coordinates.some(poly => spcPointInRing(point, poly[0]));
      return false;
    }
    function spcHighestRisk(features, pos) {
      let best = null;
      for (const feature of features) {
        const props = feature.properties || {};
        const dn = Number(props.DN ?? 0);
        if (dn <= 0) continue;
        if (!spcPointInGeometry(pos, feature.geometry)) continue;
        if (best && dn <= best.dn) continue;
        best = {
          dn,
          level: {
            label: String(props.LABEL ?? ''),
            labelLong: String(props.LABEL2 ?? props.LABEL ?? ''),
            color: String(props.fill ?? props.stroke ?? ''),
            issued: String(props.ISSUE_ISO ?? props.ISSUE ?? ''),
            expires: String(props.EXPIRE_ISO ?? props.EXPIRE ?? ''),

      return best ? best.level : null;
    }
    const SPC_RISK_RANK = ['TSTM', 'MRGL', 'SLGT', 'ENH', 'MDT', 'HIGH'];
    function spcRiskRank(label) {

      return i === -1 ? -1 : i;
    }
    let spcOutlooks = null; // [{day:1,categorical,tornado}, {day:2,...}, {day:3,...}] once loaded
    async function updateSpcOutlook() {
      if (settings.latitude === null || settings.longitude === null) return;
      const pos = { lat: settings.latitude, lon: settings.longitude };
      try {
        const [cat1, torn1, cat2, torn2, cat3] = await Promise.all([
          fetchSpcOutlook(SPC_OUTLOOK_URLS['1-cat']),
          fetchSpcOutlook(SPC_OUTLOOK_URLS['1-torn']),
          fetchSpcOutlook(SPC_OUTLOOK_URLS['2-cat']),
          fetchSpcOutlook(SPC_OUTLOOK_URLS['2-torn']),
          fetchSpcOutlook(SPC_OUTLOOK_URLS['3-cat']),
        ]);
        spcOutlooks = [
          { day: 1, categorical: spcHighestRisk(cat1, pos), tornado: spcHighestRisk(torn1, pos) },
          { day: 2, categorical: spcHighestRisk(cat2, pos), tornado: spcHighestRisk(torn2, pos) },
          { day: 3, categorical: spcHighestRisk(cat3, pos), tornado: null },
        ];
        const day2Rank = spcOutlooks[1].categorical ? spcRiskRank(spcOutlooks[1].categorical.label) : -1;
        const day3Rank = spcOutlooks[2].categorical ? spcRiskRank(spcOutlooks[2].categorical.label) : -1;
        day23HasSomethingToShow = Math.max(day2Rank, day3Rank) >= spcRiskRank('SLGT');
      } catch (err) {
        // leave last-known outlook in place -- a single missed poll isn't an outage
      }
    }

    // Nearby (but not local) Severe Thunderstorm Warnings -- feeds the baseline radar's
    // "mix in a little VEL at MID/CLOSE zoom when a real severe storm is within
    // NEARBY_SEVERE_RADIUS_MILES" rule (see radarModeTick). Deliberately a real distance to the
    // warning's actual polygon EDGE, not its centroid -- "20 miles from the edge" is what was
    // asked for, and a big warning polygon's centroid can be tens of miles from its own boundary.
    // This is a genuinely different query than the alerts-at-point fetch everywhere else in this
    // file uses (that one only ever returns alerts that already cover this exact point) --
    // national active-severe-warnings is a small enough list to fetch in full and measure
    // distance against every one of them.
    const NEARBY_SEVERE_RADIUS_MILES = 20;
    let nearbySevereWarningMiles = null;
    // Local equirectangular projection around the query point -- accurate enough at the scale
    // of a single warning polygon (tens of miles across at most), much cheaper than proper
    // geodesic point-to-segment math for a value that only needs to be right to about a mile.
    function pointToSegmentMiles(lat, lon, lat1, lon1, lat2, lon2) {
      const milesPerDegLat = 69.0;
      const milesPerDegLon = 69.0 * Math.cos(lat * Math.PI / 180);
      const px = (lon - lon1) * milesPerDegLon, py = (lat - lat1) * milesPerDegLat;
      const dx = (lon2 - lon1) * milesPerDegLon, dy = (lat2 - lat1) * milesPerDegLat;
      const lenSq = dx * dx + dy * dy;
      let t = lenSq > 0 ? (px * dx + py * dy) / lenSq : 0;
      t = Math.max(0, Math.min(1, t));
      const cx = dx * t, cy = dy * t;
      return Math.sqrt((px - cx) ** 2 + (py - cy) ** 2);
    }
    function minDistanceToPolygonMiles(lat, lon, geometry) {
      if (!geometry) return null;
      const rings = geometry.type === 'Polygon' ? [geometry.coordinates[0]]
        : geometry.type === 'MultiPolygon' ? geometry.coordinates.map(p => p[0])
        : null;
      if (!rings) return null;
      let min = Infinity;
      for (const ring of rings) {
        for (let i = 0; i < ring.length - 1; i++) {
          const [lon1, lat1] = ring[i];
          const [lon2, lat2] = ring[i + 1];
          const d = pointToSegmentMiles(lat, lon, lat1, lon1, lat2, lon2);
          if (d < min) min = d;
        }
      }
      return Number.isFinite(min) ? min : null;
    }
    async function updateNearbySevereWarnings() {
      if (settings.latitude === null || settings.longitude === null) return;
      try {
        const url = 'https://api.weather.gov/alerts/active?event=Severe%20Thunderstorm%20Warning';
        const res = await fetch(url, { headers: { Accept: 'application/geo+json' } });
        if (!res.ok) throw new Error('nearby severe warnings fetch failed');
        const data = await res.json();
        const features = Array.isArray(data.features) ? data.features : [];
        let min = null;
        for (const feature of features) {
          const d = minDistanceToPolygonMiles(settings.latitude, settings.longitude, feature.geometry);
          if (d !== null && (min === null || d < min)) min = d;
        }
        nearbySevereWarningMiles = min;
      } catch (err) {
        // leave last-known distance in place -- a single missed poll isn't an outage
      }
    }

    // Nearby Chaser Reports -- ported from the mobile app's src/services/stormReports.ts (NWS
    // Local Storm Reports via ArcGIS + Spotter Network's public report feed) and spotters.ts
    // (Spotter Network's anonymous GRLevelX position feed, the same one GR2Analyst/RadarScope
    // read from). Both are public/no-auth. "Nearby count" is computed fresh here (neither repo
    // had this metric before): active spotters within settings.chaserRadiusMiles of Nick's own
    // GPS position.
    function distanceMiles(a, b) {
      const r = 3958.8;
      const dLat = ((b.lat - a.lat) * Math.PI) / 180;
      const dLon = ((b.lon - a.lon) * Math.PI) / 180;
      const lat1 = (a.lat * Math.PI) / 180;
      const lat2 = (b.lat * Math.PI) / 180;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * r * Math.asin(Math.sqrt(h));
    }
    const LSR_QUERY_URL = 'https://mapservices.weather.noaa.gov/vector/rest/services/obs/nws_local_storm_reports/MapServer/0/query';
    const SPOTTER_NETWORK_REPORTS_URL = 'https://www.spotternetwork.org/feeds/reports.txt';
    const SPOTTER_FEED_URL = 'https://www.spotternetwork.org/feeds/gr.txt';
    const ACTIVE_SPOTTER_MAX_AGE_MS = 8 * 60_000;
    function readStr(value) { return typeof value === 'string' ? value.trim() : ''; }
    function readNum(value) {
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (typeof value === 'string') { const n = Number(value); if (Number.isFinite(n)) return n; }
      return null;
    }
    function spcBoundingBox(origin, radiusMiles) {
      const latDelta = radiusMiles / 69;
      const lonDelta = radiusMiles / Math.max(1, Math.cos((origin.lat * Math.PI) / 180) * 69);
      return {
        xmin: origin.lon - lonDelta, ymin: origin.lat - latDelta,
        xmax: origin.lon + lonDelta, ymax: origin.lat + latDelta,
        spatialReference: { wkid: 4326 },
      };
    }
    function parseValidTime(rawDate, rawText) {
      const dateMs = readNum(rawDate);
      if (dateMs != null) return dateMs;
      const text = readStr(rawText);
      const parsed = text ? Date.parse(text) : NaN;
      return Number.isFinite(parsed) ? parsed : Date.now();
    }
    function decodeSpotterText(value) { return value.replace(/\\n/g, '\n').replace(/\\"/g, '"').trim(); }
    function parseSpotterReportBody(body) {
      const lines = decodeSpotterText(body).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const reporter = (lines.find(l => l.toLowerCase().startsWith('reported by:')) || '').replace(/^reported by:\s*/i, '').trim();
      const time = (lines.find(l => l.toLowerCase().startsWith('time:')) || '').replace(/^time:\s*/i, '').trim();
      const notes = (lines.find(l => l.toLowerCase().startsWith('notes:')) || '').replace(/^notes:\s*/i, '').trim();
      const detailLines = lines.filter(l => !/^reported by:|^time:|^notes:/i.test(l));
      const type = detailLines[0] || 'Spotter Report';
      const size = (lines.find(l => l.toLowerCase().startsWith('size:')) || '').replace(/^size:\s*/i, '').trim();
      const magnitude = size || (detailLines.slice(1).find(l => /\b(mph|kts?|in|cm|measured|estimated)\b/i.test(l)) || '');
      return { reporter, time, notes, type, magnitude };
    }
    async function getSpotterNetworkReports(origin, radiusMiles, retentionHours, signal) {
      const res = await fetch(SPOTTER_NETWORK_REPORTS_URL, { signal, cache: 'no-store' });
      if (!res.ok) throw new Error(`Spotter Network ${res.status}`);
      const text = await res.text();
      const cutoff = Date.now() - retentionHours * 60 * 60 * 1000;
      const reports = [];
      for (const line of text.split(/\r?\n/)) {
        const match = line.match(/^Icon:\s*(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?),[^"]*"([\s\S]*)"$/);
        if (!match) continue;
        const lat = Number(match[1]), lon = Number(match[2]);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        const parsed = parseSpotterReportBody(match[3]);
        const validTime = Date.parse(parsed.time.replace(' UTC', 'Z'));
        if (!Number.isFinite(validTime) || validTime < cutoff) continue;
        const reportDistance = distanceMiles(origin, { lat, lon });
        if (reportDistance > radiusMiles) continue;
        reports.push({
          source: 'Spotter Network', type: parsed.type,
          location: parsed.reporter ? `Reported by ${parsed.reporter}` : 'Spotter Network report',
          remarks: parsed.notes, validTime, lat, lon, distanceMiles: reportDistance,
        });
      }
      return reports;
    }
    async function getNwsLocalStormReports(origin, radiusMiles, retentionHours, signal) {
      const qs = new URLSearchParams({
        f: 'geojson', where: '1=1',
        outFields: 'objectid,wfo_id,wfo,lsr_validtime,descript,loc_desc,state,magnitude,units,remarks,valid_time',
        geometry: JSON.stringify(spcBoundingBox(origin, radiusMiles)),
        geometryType: 'esriGeometryEnvelope', inSR: '4326', outSR: '4326',
        spatialRel: 'esriSpatialRelIntersects', orderByFields: 'lsr_validtime desc',
        resultRecordCount: '2000', returnGeometry: 'true',
      });
      const res = await fetch(`${LSR_QUERY_URL}?${qs}`, { signal });
      if (!res.ok) throw new Error(`NWS ${res.status}`);
      const body = await res.json();
      const cutoff = Date.now() - retentionHours * 60 * 60 * 1000;
      return (body.features || []).map(feature => {
        const coords = feature.geometry && feature.geometry.coordinates;
        if (!Array.isArray(coords) || coords.length < 2) return null;
        const lon = readNum(coords[0]), lat = readNum(coords[1]);
        if (lat == null || lon == null) return null;
        const props = feature.properties || {};
        const validTime = parseValidTime(props.lsr_validtime, props.valid_time);
        if (validTime < cutoff) return null;
        const reportDistance = distanceMiles(origin, { lat, lon });
        if (reportDistance > radiusMiles) return null;
        return {
          source: 'NWS', type: readStr(props.descript) || 'Report',
          location: readStr(props.loc_desc) || 'Unknown location', state: readStr(props.state),
          magnitude: readStr(props.magnitude), units: readStr(props.units), remarks: readStr(props.remarks),
          validTime, lat, lon, distanceMiles: reportDistance,
        };
      }).filter(Boolean);
    }
    async function getNearbyStormReports(origin, radiusMiles, retentionHours) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15_000);
      try {
        const results = await Promise.allSettled([
          getNwsLocalStormReports(origin, radiusMiles, retentionHours, controller.signal),
          getSpotterNetworkReports(origin, radiusMiles, retentionHours, controller.signal),
        ]);
        return results.flatMap(r => (r.status === 'fulfilled' ? r.value : []))
          .sort((a, b) => b.validTime - a.validTime || a.distanceMiles - b.distanceMiles);
      } finally {
        clearTimeout(timer);
      }
    }
    function spotterTimestampMs(rawTimestamp) {
      if (!rawTimestamp) return null;
      const parsed = new Date(rawTimestamp).getTime();
      return Number.isFinite(parsed) ? parsed : null;
    }
    function isActiveSpotter(spotter, now) {

      return spotter.updatedAtMs != null && spotter.updatedAtMs <= now + 60_000 && now - spotter.updatedAtMs <= ACTIVE_SPOTTER_MAX_AGE_MS;
    }
    function parseSpotterFeed(raw, origin) {

        if (line.startsWith('Object:')) {
          const [latStr, lonStr] = line.slice('Object:'.length).trim().split(',');
          const lat = Number(latStr), lon = Number(lonStr);
          pending = Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : null;
          continue;
        }
        if (line.startsWith('Icon:') && pending) {
          const match = line.match(/"([^"]*)"/);
          const position = pending;
          pending = null;
          if (!match) continue;
          const parts = match[1].split('\\n').map(p => p.trim()).filter(Boolean);
          const [name, timestamp] = parts;
          if (!name) continue;
          spotters.push({
            name, lat: position.lat, lon: position.lon,
            distanceMiles: distanceMiles(origin, position),
            updatedAtMs: spotterTimestampMs(timestamp || ''),
          });
        }
      }
      return spotters;
    }
    async function getNearbySpotters(origin, radiusMiles) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15_000);
      try {
        const res = await fetch(SPOTTER_FEED_URL, { cache: 'no-store', signal: controller.signal });
        if (!res.ok) throw new Error(String(res.status));
        const text = await res.text();
        return parseSpotterFeed(text, origin)
          .filter(s => isActiveSpotter(s) && s.distanceMiles <= radiusMiles)
          .sort((a, b) => a.distanceMiles - b.distanceMiles);
      } finally {
        clearTimeout(timer);
      }
    }
    let CHASER_COUNT = 0;
    let chasersHasReports = false;
    let latestChaserReport = null;
    // Full lists (not just the count/latest) kept around so the radar mini-map can plot them as
    // pins via renderRadarReportPins() -- same fetch, no duplicate network calls.
    let nearbyReports = [];
    let nearbySpotters = [];
    async function updateChaserData() {
      if (settings.latitude === null || settings.longitude === null) return;
      const origin = { lat: settings.latitude, lon: settings.longitude };
      try {
        const spotters = await getNearbySpotters(origin, settings.chaserRadiusMiles);
        CHASER_COUNT = spotters.length;
        nearbySpotters = spotters;
      } catch (err) {
        // leave last-known count in place -- a single missed poll isn't an outage
      }
      try {
        const reports = await getNearbyStormReports(origin, settings.chaserRadiusMiles, settings.chaserReportRetentionHours);
        latestChaserReport = reports[0] || null;
        chasersHasReports = latestChaserReport !== null;
        nearbyReports = reports;
      } catch (err) {
        // leave last-known report in place -- a single missed poll isn't an outage
      }
      renderRadarReportPins();
    }

    // Tornado Params (CAPE/CIN/Shear/SRH/LCL/STP) -- real, already deployed: Code Black's own
    // Core API runs a full HRRR-model-derived "Storm Intel" service
    // (services/core-api/src/code_black_core_api/storm_intel/ in the Code Black repo) with
    // exactly this metric set, and `web/ops/functions/lib/publicStormIntelRelay.ts` already
    // exposes a public, no-auth, CORS-open point route for a broadcast overlay through the same
    // /overlay-core/* prefix classic-v2.html already uses for the Mapbox token -- built for
    // this exact purpose, just never wired up client-side until now. Verified live during this
    // change: real HRRR analysis values, `simulation:false`.
    let stormIntelMetrics = null; // Map<MetricKey, {value, unit, availability}> once loaded
    let stormIntelAvailable = false;
    async function updateStormIntel() {
      if (settings.latitude === null || settings.longitude === null) return;
      try {
        const url = `${settings.chaseGatewayBase}/overlay-core/api/storm-intel/v1/point?latitude=${settings.latitude}&longitude=${settings.longitude}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('storm-intel fetch failed');
        const data = await res.json();
        if (!data.available) { stormIntelAvailable = false; return; }
        const byKey = new Map();
        for (const m of data.metrics || []) byKey.set(m.key, m);
        stormIntelMetrics = byKey;
        stormIntelAvailable = true;
      } catch (err) {
        // leave last-known snapshot in place -- a single missed poll isn't an outage
      }
    }

    // Sun & Moon -- entirely new, nothing in either repo calculated this before. Client-side
    // astronomical math (standard low-precision solar/lunar position formulas, the same public
    // equations SunCalc-style libraries implement -- not copied from any library's source, no
    // API/key needed, matching the rest of this file's "no new dependency" constraint).
    const ASTRO_RAD = Math.PI / 180;
