            <svg class="pv-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5h15M6.5 9h11M8.5 13h7M10.5 17h3"/></svg>
            Tornado Potential — Not Yet Available
          </div>
          <div class="params-row">${rowHtml}</div>
          <div class="params-footer"></div>
        </div>`;
        return;
      }
      const m = key => stormIntelMetrics.get(key);
      const withColor = (scaleKey, metricKey, unit, lab, transform) => {
        const metric = m(metricKey);
        if (!metric || metric.availability !== 'available' || metric.value == null) {
          return { val: 'N/A', unit: '', lab, idx: -1, color: 'var(--muted)' };
        }
        const raw = transform ? transform(metric.value) : metric.value;
        const idx = PARAM_SCALES[scaleKey](raw);
        return { val: Math.round(raw).toLocaleString(), unit, lab, idx, color: PARAM_RATING_COLORS[idx] };
      };
      const stpMetric = m('significant_tornado_parameter');
      const stpVal = stpMetric && stpMetric.availability === 'available' && stpMetric.value != null ? stpMetric.value : null;
      const ALL = [
        withColor('cape', 'mlcape', 'J/kg', 'CAPE'),
        withColor('cin', 'mlcin', 'J/kg', 'CIN'),
        withColor('shear', 'bulk_shear_0_6km', 'kt', 'Shear', v => v * MS_TO_KT),
        withColor('srh', 'srh_0_1km', 'm²/s²', 'SRH'),
        withColor('lcl', 'lcl_height', 'ft', 'LCL', v => v * M_TO_FT),
        stpVal !== null
          ? { val: stpVal.toFixed(1), unit: '', lab: 'STP', idx: PARAM_SCALES.stp(stpVal), color: PARAM_RATING_COLORS[PARAM_SCALES.stp(stpVal)] }
          : { val: 'N/A', unit: '', lab: 'STP', idx: -1, color: 'var(--muted)' },
      ];
      const rating = stpVal !== null ? paramOverallRating(stpVal) : null;
      const bar = idx => Array.from({ length: 5 }, (_, i) =>
        `<span${idx >= 0 && i <= idx ? ` style="background:${PARAM_RATING_COLORS[idx]};"` : ''}></span>`).join('');
      const rowHtml = ALL.map(item => `
        <div class="param">
          <div class="p-val" style="color:${item.color};">${item.val}${item.unit ? `<span class="p-unit">${item.unit}</span>` : ''}</div>
          <div class="p-lab">${item.lab}</div>
          <div class="p-bar">${bar(item.idx)}</div>
        </div>`).join('');
      midBar.innerHTML = `<div class="params-wrap">
        <div class="params-verdict" style="background:${rating ? rating.color : 'rgba(255,255,255,0.12)'}; ${rating ? '' : 'color:var(--text);'}">
          <svg class="pv-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5h15M6.5 9h11M8.5 13h7M10.5 17h3"/></svg>
          Tornado Potential — ${rating ? rating.label : 'N/A'}
        </div>
        <div class="params-row">${rowHtml}</div>
        <div class="params-footer"></div>
      </div>`;
    }
    function renderForecast() {
      const title = lastLocationName || 'Awaiting GPS feed...';
      if (!forecastDays) {
        midBar.innerHTML = `<div class="forecast-wrap">
          <div class="forecast-title">${title}</div>
          <div class="forecast-row"><div class="forecast-day"><div class="f-text"><div class="f-toprow"><span class="f-lab">Awaiting forecast data...</span></div></div></div></div>
        </div>`;
        return;
      }
      midBar.innerHTML = `<div class="forecast-wrap">
        <div class="forecast-title">${title}</div>
        <div class="forecast-row">${forecastDays.map(d => `
          <div class="forecast-day">
            ${F_ICONS[d.icon]}
            <div class="f-text">
              <div class="f-toprow"><span class="f-lab">${d.lab}</span><span class="f-hilo">${d.hi}°<span class="lo">${d.lo}°</span></span></div>
              <div class="f-cond">${d.cond} · ${F_DROP}<span class="drop">${d.precip}%</span></div>
            </div>
          </div>`).join('')}</div>
      </div>`;
    }
    const radarBody = document.getElementById('radarBody');
    const radarModeText = document.getElementById('radarModeText');

    // ---- Radar: single-site, auto-switching, looped REF normally; VEL/CC priority rotation
    // during an active tornado warning. Backed by radar-worker via the public codeblack-
    // radar-relay Worker -- see workers/radar-relay/. No auth needed: public NOAA data. Ported
    // from classic.html -- see there for the full rationale on each piece below.
    let MAPBOX_TOKEN = params.get('mapboxToken') || '';
    const MAPBOX_STYLE = params.get('mapboxStyle') || 'mapbox://styles/mapbox/navigation-night-v1';
    const RADAR_FRAME_POOL_SIZE = 6;
    const radarSourceIds = Array.from({ length: RADAR_FRAME_POOL_SIZE }, (_, i) => `radar-source-${i}`);
    const radarLayerIds = Array.from({ length: RADAR_FRAME_POOL_SIZE }, (_, i) => `radar-layer-${i}`);
    const BLANK_TILE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
    const WARNING_POLYGON_SOURCE_ID = 'warning-polygon-source';
    const WARNING_POLYGON_FILL_LAYER_ID = 'warning-polygon-fill';
    const WARNING_POLYGON_LINE_LAYER_ID = 'warning-polygon-line';
    const EMPTY_FEATURE_COLLECTION = { type: 'FeatureCollection', features: [] };
    let pendingWarningPolygonFeatures = undefined;
    // Real US Census cartographic county boundaries (2010, 1:20,000,000 -- the lightest public
    // simplification level), verified reachable during this change.
    const COUNTY_LINES_URL = 'https://raw.githubusercontent.com/kjhealy/us-county/master/data/geojson/gz_2010_us_050_00_20m.json';
    const COUNTY_LINES_SOURCE_ID = 'county-lines-source';
    const COUNTY_LINES_LAYER_ID = 'county-lines-layer';
    const REPORT_PINS_SOURCE_ID = 'report-pins-source';
    const REPORT_PINS_LAYER_ID = 'report-pins-layer';
    const SPOTTER_PINS_SOURCE_ID = 'spotter-pins-source';
    const SPOTTER_PINS_LAYER_ID = 'spotter-pins-layer';
    const radarSettings = { gatewayBase: params.get('radarGatewayBase') || 'https://ops.codeblackwx.com' };
    const RADAR_ZOOM_LEVELS = [
      { name: 'CLOSE', zoom: params.get('radarZoomClose') ? Number(params.get('radarZoomClose')) : 9 },
      { name: 'MID', zoom: params.get('radarZoomMid') ? Number(params.get('radarZoomMid')) : 7 },
      { name: 'FAR', zoom: params.get('radarZoomFar') ? Number(params.get('radarZoomFar')) : 5 },
    ];
    function atFarZoom() { return radarZoomIndex === 2; }
    // Baseline (no local alert) hold times are asymmetric by design -- FAR gets the longest look
    // (the big-picture view), CLOSE the shortest (a quick current check before moving on).
    // Warning-tier zoom cycling (CLOSE/MID only) keeps its own uniform legacy timing --
    // untouched, wasn't part of this change.
    const ZOOM_HOLD_MS = { FAR: 20000, MID: 15000, CLOSE: 9000 };
    const WARNING_ZOOM_HOLD_MS = 11200;
    let radarZoomIndex = 0;
    let radarZoomChangedAt = Date.now();
    let radarPositionMarker = null;
    let radarSiteId = null;
    let radarProduct = 'REF';
    let radarFrames = [];
    let radarLoopIndex = 0;
    const CLOSE_MINI_LOOP_FRAMES = 3;
    let radarCloseLoopTick = 0;
    let radarFrameFetchInFlight = false;
    let radarTickCount = 0;
    let torRotationIndex = 0;
    let severeRotationIndex = 0;
    let baselineNearbyRotationIndex = 0;
    // isTorWarning/isWarningActive are set from the real alert pipeline (see applyRealAlertTier
    // below) instead of classic.html's own updateAlert() -- same flags, same meaning, just fed
    // by this file's own alert wiring.
    let isTorWarning = false;
    let isSevereWarning = false;
    let isWarningActive = false;
    let radarMap = null;
    let radarMapReady = false;
    let pendingRadarFrames = null;
    const TOR_PRODUCT_ROTATION = ['VEL', 'REF', 'VEL', 'CC', 'VEL', 'REF'];
    // Severe Thunderstorm Warning gets VEL mixed in too, but at a real minority share (1 of 4
    // slots, 25%) versus tornado's 3 of 6 (50%) -- velocity still matters for a severe/rotating
    // storm, just not the top priority a tornado threat is.
    const SEVERE_PRODUCT_ROTATION = ['REF', 'REF', 'REF', 'VEL'];
    const WARNING_PRODUCT_HOLD_TICKS = 8;

    // REF/VEL now render from IEM's RIDGE WMS (mesonet.agron.iastate.edu) instead of our own
    // radar-relay/radar-worker pipeline -- real NWS-quality pre-rendered/smoothed single-site
    // imagery, free, no key. Verified live during this change: real scan timestamps, real PNG
    // tiles for both products. CC has no IEM RIDGE equivalent (dual-pol correlation coefficient
    // isn't part of the legacy RIDGE product set) and stays on our own radar-relay/radar-worker
    // decode, which is untouched and still fully live -- a real upgrade to that decoder (proper
    // gate/radial interpolation instead of nearest-neighbor) is future work, not scrapped.
    const IEM_RIDGE_BASE = 'https://mesonet.agron.iastate.edu';
    const IEM_PRODUCT_CODE = { REF: 'N0B', VEL: 'N0S' };
    function iemSectorFor(siteId) {
      // IEM's `sector` param is the 3-letter site code with no leading K (CONUS sites only --
      // Alaska/Hawaii/PR/Guam sites use different prefixes and aren't handled here).
      return String(siteId || '').replace(/^K/i, '').toUpperCase();
    }

    async function resolveMapboxToken() {
      if (MAPBOX_TOKEN) return MAPBOX_TOKEN;
      try {
        const res = await fetch(`${radarSettings.gatewayBase}/overlay-core/mapbox-token`);
        if (!res.ok) return '';
        const data = await res.json();
        return data.token || '';
      } catch (err) {
        return '';
      }
    }

    async function initRadarMap() {
      if (radarMap || typeof mapboxgl === 'undefined') return;
      MAPBOX_TOKEN = await resolveMapboxToken();
      if (radarMap) return;
      if (!MAPBOX_TOKEN) {
        document.getElementById('radarLoading').textContent = 'Mapbox token unavailable';
        return;
      }
      mapboxgl.accessToken = MAPBOX_TOKEN;
      radarMap = new mapboxgl.Map({
        container: 'radarMap',
        style: MAPBOX_STYLE,
        center: [-97.5, 35.5],
        zoom: RADAR_ZOOM_LEVELS[radarZoomIndex].zoom,
        interactive: false,
        attributionControl: true,
      });
      radarMap.on('load', () => {
        // County lines -- below the radar raster, above the basemap. Real US Census cartographic
        // county boundaries (2010, 1:20,000,000 simplification -- light enough for a background
        // layer), fetched once; Mapbox GL handles the request itself when `data` is a URL.
        radarMap.addSource(COUNTY_LINES_SOURCE_ID, { type: 'geojson', data: COUNTY_LINES_URL });
        radarMap.addLayer({
          id: COUNTY_LINES_LAYER_ID, type: 'line', source: COUNTY_LINES_SOURCE_ID,
          paint: { 'line-color': 'rgba(255,255,255,0.22)', 'line-width': 0.6 },
        });
        for (let i = 0; i < RADAR_FRAME_POOL_SIZE; i++) {
          radarMap.addSource(radarSourceIds[i], { type: 'raster', tiles: [BLANK_TILE], tileSize: 256 });
          radarMap.addLayer({ id: radarLayerIds[i], type: 'raster', source: radarSourceIds[i], paint: { 'raster-opacity': 0 } });
        }
        // fill/line color is data-driven (per-feature 'color' property, set in
        // setWarningPolygonFeatures below) instead of a fixed red -- each polygon now draws in
        // its own tier's real color, the exact same ALERT_TIERS[key].color1 driving that tier's
        // fx-panel glow (see setAlertBoxesTier), so a Tornado Watch's polygon reads yellow, a
        // Considerable severe reads amber, etc, not every warning painted identically red.
        radarMap.addSource(WARNING_POLYGON_SOURCE_ID, { type: 'geojson', data: EMPTY_FEATURE_COLLECTION });
        radarMap.addLayer({
          id: WARNING_POLYGON_FILL_LAYER_ID, type: 'fill', source: WARNING_POLYGON_SOURCE_ID,
          paint: { 'fill-color': ['coalesce', ['get', 'color'], '#FF0000'], 'fill-opacity': 0.12 },
        });
        radarMap.addLayer({
          id: WARNING_POLYGON_LINE_LAYER_ID, type: 'line', source: WARNING_POLYGON_SOURCE_ID,
          paint: { 'line-color': ['coalesce', ['get', 'color'], '#FF0000'], 'line-width': 3, 'line-opacity': 0.95 },
        });
        // Storm/spotter report pins -- topmost, above radar and warning polygons. Two separate
        // sources/layers (different color language: reports = accent red like the rest of the
        // overlay's alert/urgency color, spotters = the same green already used for the Nearby
        // Chasers card) so the two feeds stay visually distinct on the map.
        radarMap.addSource(REPORT_PINS_SOURCE_ID, { type: 'geojson', data: EMPTY_FEATURE_COLLECTION });
        radarMap.addLayer({
          id: REPORT_PINS_LAYER_ID, type: 'circle', source: REPORT_PINS_SOURCE_ID,
          paint: {
            'circle-radius': 5, 'circle-color': '#ff2a2a',
            'circle-stroke-width': 1.5, 'circle-stroke-color': 'rgba(255,255,255,0.9)',
          },
        });
        radarMap.addSource(SPOTTER_PINS_SOURCE_ID, { type: 'geojson', data: EMPTY_FEATURE_COLLECTION });
        radarMap.addLayer({
          id: SPOTTER_PINS_LAYER_ID, type: 'circle', source: SPOTTER_PINS_SOURCE_ID,
          paint: {
            'circle-radius': 4, 'circle-color': '#35d488',
            'circle-stroke-width': 1.5, 'circle-stroke-color': 'rgba(255,255,255,0.9)',
          },
        });
        radarMapReady = true;
        if (pendingRadarFrames) { preloadRadarFrames(pendingRadarFrames); pendingRadarFrames = null; }
        if (pendingWarningPolygonFeatures !== undefined) {
          setWarningPolygonFeatures(pendingWarningPolygonFeatures);
          pendingWarningPolygonFeatures = undefined;
        }
        renderRadarReportPins();
      });
    }

    function centerRadarMapOnPosition() {
      if (!radarMap || settings.latitude === null || settings.longitude === null) return;
      const lngLat = [settings.longitude, settings.latitude];
      radarMap.easeTo({ center: lngLat, zoom: RADAR_ZOOM_LEVELS[radarZoomIndex].zoom, duration: 2000 });
      if (!radarPositionMarker) {
        const el = document.createElement('div');
        el.className = 'radar-position-marker';
        el.innerHTML = '<div class="radar-position-marker__ring"></div><div class="radar-position-marker__core"></div>';
        radarPositionMarker = new mapboxgl.Marker({ element: el, anchor: 'center' }).setLngLat(lngLat).addTo(radarMap);
      } else {
        radarPositionMarker.setLngLat(lngLat);
      }
    }

    async function updateRadarSite() {
      if (settings.latitude === null || settings.longitude === null) return;
      centerRadarMapOnPosition();
      try {
        const url = `${radarSettings.gatewayBase}/api/v1/radar/sites/nearest?lat=${settings.latitude}&lon=${settings.longitude}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('sites fetch failed');
        const sites = await res.json();
        const nearest = Array.isArray(sites) ? sites[0] : null;
        if (!nearest || nearest.id === radarSiteId) return;
        radarSiteId = nearest.id;
        radarFrames = [];
        radarLoopIndex = 0;
        radarCloseLoopTick = 0;
        await fetchRadarFrames();
      } catch (err) {
        // leave last-known site in place -- a single missed lookup isn't an outage
      }
    }

    async function fetchRadarFrames() {
      if (!radarSiteId || radarFrameFetchInFlight) return;
      radarFrameFetchInFlight = true;
      try {
        if (radarProduct === 'CC') {
          // No IEM equivalent -- unchanged path through our own radar-relay/radar-worker.
          const url = `${radarSettings.gatewayBase}/api/v1/radar/frames?site=${encodeURIComponent(radarSiteId)}&product=CC&limit=1`;
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          if (!res.ok) throw new Error('frames fetch failed');
          const frames = await res.json();
          if (Array.isArray(frames) && frames.length) {
            radarFrames = frames.map(f => ({ kind: 'own', frameId: f.frameId }));
            radarLoopIndex = 0;
            radarCloseLoopTick = 0;
            preloadRadarFrames(radarFrames);
            document.getElementById('radarLoading').classList.add('hidden');
          }
          return;
        }
        const iemProduct = IEM_PRODUCT_CODE[radarProduct];
        const sector = iemSectorFor(radarSiteId);
        const limit = radarProduct === 'REF' ? RADAR_FRAME_POOL_SIZE : 1;
        const url = `${IEM_RIDGE_BASE}/json/radar.py?operation=list&radar=${encodeURIComponent(sector)}&product=${iemProduct}`;
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        if (!res.ok) throw new Error('IEM scan list fetch failed');
        const data = await res.json();
        const scans = Array.isArray(data.scans) ? data.scans : [];
        const sorted = scans.map(s => s.ts).filter(Boolean).sort().reverse().slice(0, limit);
        if (sorted.length) {
          radarFrames = sorted.map(ts => ({ kind: 'iem', ts }));
          radarLoopIndex = 0;
          radarCloseLoopTick = 0;
          preloadRadarFrames(radarFrames);
          document.getElementById('radarLoading').classList.add('hidden');
        }
      } catch (err) {
        // leave last-known frames in place -- a single missed poll isn't an outage
      } finally {
        radarFrameFetchInFlight = false;
      }
    }

    // IEM single-archive WMS wants explicit UTC year/month/day/time(HHMM) query params, parsed
    // from the scan's ISO timestamp (e.g. "2026-09-10T02:51Z") -- confirmed live against the real
    // service during this change.
    function iemArchiveTileUrl(sector, product, ts) {
      const d = new Date(ts);
      const year = d.getUTCFullYear();
      const month = String(d.getUTCMonth() + 1).padStart(2, '0');
      const day = String(d.getUTCDate()).padStart(2, '0');
      const time = String(d.getUTCHours()).padStart(2, '0') + String(d.getUTCMinutes()).padStart(2, '0');
      const qs = new URLSearchParams({
        SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap', LAYERS: 'single-archive',
        SRS: 'EPSG:3857', WIDTH: '256', HEIGHT: '256', FORMAT: 'image/png', TRANSPARENT: 'TRUE',
        sector, prod: product, year: String(year), month, day, time,
      });
      return `${IEM_RIDGE_BASE}/cgi-bin/wms/nexrad/ridge.cgi?${qs}&BBOX={bbox-epsg-3857}`;
    }

    const RADAR_PRELOAD_STAGGER_MS = 650;
    function preloadRadarFrames(frames) {
      if (!radarMapReady) { pendingRadarFrames = frames; return; }
      const sector = iemSectorFor(radarSiteId);
      const iemProduct = IEM_PRODUCT_CODE[radarProduct];
      for (let i = 0; i < RADAR_FRAME_POOL_SIZE; i++) {
        const frame = frames[i];
        let url = BLANK_TILE;
        if (frame && frame.kind === 'iem') {
          url = iemArchiveTileUrl(sector, iemProduct, frame.ts);
        } else if (frame && frame.kind === 'own') {
          url = `${radarSettings.gatewayBase}/api/v1/radar/tiles/${frame.frameId}/{z}/{x}/{y}.png`;
        }
        window.setTimeout(() => {
          const source = radarMap.getSource(radarSourceIds[i]);
          if (source) source.setTiles([url]);
        }, i * RADAR_PRELOAD_STAGGER_MS);
      }
    }

    function applyRadarFrame(index) {
      if (!radarMapReady) return;
      radarLayerIds.forEach((id, i) => {
        if (radarMap.getLayer(id)) radarMap.setPaintProperty(id, 'raster-opacity', i === index ? 0.92 : 0);
      });
    }

    // Draws every currently-active alert's real polygon, not just the single highest-severity
    // one -- classic.html's original only ever drew the primary alert's shape. `features` is
    // whatever the last alerts/active?point= fetch returned (all alerts covering Nick's own
    // position); zone-based products (watches/advisories) are naturally excluded since NWS never
    // gives those real geometry.
    function setWarningPolygonFeatures(features) {
      if (!radarMapReady) { pendingWarningPolygonFeatures = features; return; }
      const source = radarMap.getSource(WARNING_POLYGON_SOURCE_ID);
      if (!source) return;
      const list = Array.isArray(features) ? features : (features ? [features] : []);
      const shapes = list.filter(f => f && f.geometry).map(f => {
        const key = TIER_KEY_MAP[alertClassFor(f)] || 'generic';
        const color = (ALERT_TIERS[key] && ALERT_TIERS[key].color1) || '#FF0000';
        return { type: 'Feature', properties: { color }, geometry: f.geometry };
      });
      source.setData(shapes.length ? { type: 'FeatureCollection', features: shapes } : EMPTY_FEATURE_COLLECTION);
    }

    // Storm/spotter report pins on the radar map -- reuses the same nearbyReports/nearbySpotters
    // fetched for the Chasers card (see updateChaserData) rather than a separate fetch.
    function renderRadarReportPins() {
      if (!radarMapReady) return;
      const reportSource = radarMap.getSource(REPORT_PINS_SOURCE_ID);
      if (reportSource) {
        reportSource.setData({
          type: 'FeatureCollection',
          features: nearbyReports.map(r => ({
            type: 'Feature',
            properties: { type: r.type, location: r.location, source: r.source },
            geometry: { type: 'Point', coordinates: [r.lon, r.lat] },
          })),
        });
      }
      const spotterSource = radarMap.getSource(SPOTTER_PINS_SOURCE_ID);
      if (spotterSource) {
        spotterSource.setData({
          type: 'FeatureCollection',
          features: nearbySpotters.map(s => ({
            type: 'Feature',
            properties: { name: s.name },
            geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
          })),
        });
      }
    }

    function setRadarProduct(product) {
      if (radarProduct === product) return;
      radarProduct = product;
      radarModeText.textContent = product;
      radarFrames = [];
      radarLoopIndex = 0;
      radarCloseLoopTick = 0;
      // Blank the map immediately instead of leaving the outgoing product's tile on screen at
      // full opacity -- fetchRadarFrames()/preloadRadarFrames() below is async (a real network
      // round trip, staggered up to RADAR_PRELOAD_STAGGER_MS per pool slot), and until it
      // finishes and calls applyRadarFrame() again, nothing else was resetting the layers that
      // were still showing the PREVIOUS product's last frame -- e.g. a stale REF tile staying
      // on screen, visibly tinted wrong, for up to a few seconds after switching to VEL.
      if (radarMapReady) {
        radarLayerIds.forEach(id => { if (radarMap.getLayer(id)) radarMap.setPaintProperty(id, 'raster-opacity', 0); });
      }
      fetchRadarFrames();
    }

    function setRadarZoom(index) {
      if (radarZoomIndex === index) return;
      radarZoomIndex = index;
      radarZoomChangedAt = Date.now();
      if (index === 0) radarCloseLoopTick = 0;
      centerRadarMapOnPosition();
    }

    // Baseline (no local alert) now runs FAR -> MID -> CLOSE -- the big-picture view first,
    // narrowing in, rather than the old CLOSE-first order. Warning-tier order (CLOSE/MID only,
    // FAR dropped -- far range isn't useful once something's actually happening close by) is
    // unchanged.
    const BASELINE_ZOOM_ORDER = [2, 1, 0];
    const WARNING_ZOOM_ORDER = [0, 1];
    function advanceZoom(order, holdMs) {
      if (Date.now() - radarZoomChangedAt < holdMs) return;
      const currentPos = order.indexOf(radarZoomIndex);
      const nextPos = currentPos === -1 ? 0 : (currentPos + 1) % order.length;
      setRadarZoom(order[nextPos]);
    }

    // Holds on the newest frame (no cycling) for at least the first half of however long this
    // zoom level is being held for -- a fresh view of a new range shouldn't immediately start
    // flipping through older frames before the viewer has even seen the current one. Cycles
    // normally for the remainder of the hold.
    function currentZoomHoldMs() {
      if (isWarningActive) return WARNING_ZOOM_HOLD_MS;
      return ZOOM_HOLD_MS[RADAR_ZOOM_LEVELS[radarZoomIndex].name] || WARNING_ZOOM_HOLD_MS;
    }
    function advanceRefLoop() {
      if (!radarFrames.length) return;
      if (Date.now() - radarZoomChangedAt < currentZoomHoldMs() / 2) {
        applyRadarFrame(0);
        return;
      }
      if (radarZoomIndex === 0) {
        if (radarCloseLoopTick < CLOSE_MINI_LOOP_FRAMES) {
          const frameIndex = Math.min(CLOSE_MINI_LOOP_FRAMES, radarFrames.length) - 1 - radarCloseLoopTick;
          applyRadarFrame(Math.max(0, frameIndex));
          radarCloseLoopTick += 1;
        } else {
          applyRadarFrame(0);
        }
        return;
      }
      applyRadarFrame(radarLoopIndex);
      radarLoopIndex = (radarLoopIndex + 1) % radarFrames.length;
    }

    function radarModeTick() {
      radarTickCount += 1;
      if (isWarningActive) {
        advanceZoom(WARNING_ZOOM_ORDER, WARNING_ZOOM_HOLD_MS);
        if (isTorWarning) {
          if (radarTickCount % WARNING_PRODUCT_HOLD_TICKS === 1) {
            const product = TOR_PRODUCT_ROTATION[torRotationIndex % TOR_PRODUCT_ROTATION.length];
            torRotationIndex += 1;
            setRadarProduct(product);
          }
          if (radarFrames.length) applyRadarFrame(0);
          return;
        }
        if (isSevereWarning) {
          if (radarTickCount % WARNING_PRODUCT_HOLD_TICKS === 1) {
            const product = SEVERE_PRODUCT_ROTATION[severeRotationIndex % SEVERE_PRODUCT_ROTATION.length];
            severeRotationIndex += 1;
            setRadarProduct(product);
          }
          if (radarFrames.length) applyRadarFrame(0);
          return;
        }
        // Flash Flood Warning (and any other warning-tier alert without its own rule above)
        // stays REF-only, looping normally.
        if (radarProduct !== 'REF') { setRadarProduct('REF'); torRotationIndex = 0; severeRotationIndex = 0; }
        advanceRefLoop();
        return;
      }
      // No local alert -- REF only, EXCEPT when a real Severe Thunderstorm Warning is active
      // somewhere nearby (within NEARBY_SEVERE_RADIUS_MILES of this position, even though it
      // doesn't cover this exact point) and we're at MID or CLOSE range: a light VEL mix gives
      // an early look at a threat that isn't here yet, without disrupting the calm FAR view.
      const nearSevere = !atFarZoom() && nearbySevereWarningMiles !== null && nearbySevereWarningMiles <= NEARBY_SEVERE_RADIUS_MILES;
      if (nearSevere) {
        if (radarTickCount % WARNING_PRODUCT_HOLD_TICKS === 1) {
          const product = SEVERE_PRODUCT_ROTATION[baselineNearbyRotationIndex % SEVERE_PRODUCT_ROTATION.length];
          baselineNearbyRotationIndex += 1;
          setRadarProduct(product);
        }
      } else if (radarProduct !== 'REF') {
        setRadarProduct('REF');
        torRotationIndex = 0; severeRotationIndex = 0; baselineNearbyRotationIndex = 0;
      }
      advanceZoom(BASELINE_ZOOM_ORDER, ZOOM_HOLD_MS[RADAR_ZOOM_LEVELS[radarZoomIndex].name] || WARNING_ZOOM_HOLD_MS);
      advanceRefLoop();
    }

    const midContent = {
      alert: () => {
        if (currentTier === 'clear') {
          midBar.classList.remove('is-alert', 'is-glass', 'alert-box-glow');
          midBar.style.removeProperty('background');
          midBar.style.removeProperty('--abg-color');
          midBar.style.removeProperty('--abg-r-soft');
          midBar.style.removeProperty('--abg-r-strong');
          renderAlertClear();
          return;
        }
        midBar.classList.add('is-alert');
        renderAlertTier(currentTier);
      },
      params: () => {
        midBar.classList.remove('is-alert');
        renderParams();
      },
      chasers: () => {
        midBar.classList.remove('is-alert');
        renderChasers(chasersHasReports);
      },
      // Real SPC data (see updateSpcOutlook below). Wind/Hail read "N/A" rather than a fabricated
      // number -- the ported spcOutlook.ts service (and this port of it) only ever fetches the
      // categorical + tornado layers, matching what's proven/tested; SPC's separate wind/hail
      // probability layers were never part of that service's scope.
      day1: () => {
        midBar.classList.remove('is-alert');
        const tIcon = '<svg class="spc-icon spc-icon-tor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16l-6 7v6l-4 3v-9z"/></svg>';
        const wIcon = '<svg class="spc-icon spc-icon-wind" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h11a2.5 2.5 0 1 0-2.2-3.6"/><path d="M3 16h14a2.5 2.5 0 1 1-2.2 3.6"/></svg>';
        const hIcon = '<svg class="spc-icon spc-icon-hail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="3"/><circle cx="16" cy="14" r="3.6"/></svg>';
        const cat = spcOutlooks && spcOutlooks[0].categorical;
        const torn = spcOutlooks && spcOutlooks[0].tornado;
        const catLabel = cat ? cat.label : '--';
        const catColor = cat ? (cat.color || '#e8c93a') : 'var(--muted)';
        const catName = cat ? cat.labelLong : 'Awaiting outlook data...';
        const tornVal = torn ? torn.label : 'N/A';
        const tornColor = torn ? (torn.color || 'var(--text)') : 'var(--muted)';
        midBar.innerHTML = `<div class="spc-split">
          <div class="spc-half">
            <div class="spc-risk-col">
              <div class="spc-pct" style="color:${catLabel === '--' ? 'var(--muted)' : catColor};">${catLabel}</div>
            </div>
            <div class="spc-textcol">
              <div class="spc-namerow"><span class="spc-risk-name">${cat ? catName : 'SPC Outlook'}</span><span class="spc-daytag">Day 1</span></div>
              ${cat ? '' : `<div class="spc-desc">${catName}</div>`}
            </div>
          </div>
          <div class="spc-half">
            <div class="spc-stats">
              <div class="spc-stat">${tIcon}<div class="spc-text"><div class="v" style="color:${tornColor};">${tornVal}</div><div class="l">Tornado</div></div></div>
              <div class="spc-stat">${wIcon}<div class="spc-text"><div class="v">N/A</div><div class="l">Wind</div></div></div>
              <div class="spc-stat">${hIcon}<div class="spc-text"><div class="v">N/A</div><div class="l">Hail</div></div></div>
            </div>
          </div>
        </div>`;
      },
      day2: () => {
        midBar.classList.remove('is-alert');
        const half = (dayNum, outlook) => {
          const cat = outlook && outlook.categorical;
          if (!cat) return `<div class="spc-half">
            <div class="spc-risk-col"><div class="spc-pct" style="color:var(--muted);">--</div></div>
            <div class="spc-textcol"><div class="spc-namerow"><span class="spc-daytag">Day ${dayNum}</span><span class="spc-namerow-dot">•</span><span class="spc-risk-name">Awaiting data</span></div></div>
          </div>`;
          return `<div class="spc-half">
            <div class="spc-risk-col"><div class="spc-pct" style="color:${cat.color || '#5cb85c'};">${cat.label}</div></div>
            <div class="spc-textcol"><div class="spc-namerow"><span class="spc-daytag">Day ${dayNum}</span><span class="spc-namerow-dot">•</span><span class="spc-risk-name">${cat.labelLong}</span></div></div>
          </div>`;
        };
        midBar.innerHTML = `<div class="spc-split">${half(2, spcOutlooks && spcOutlooks[1])}${half(3, spcOutlooks && spcOutlooks[2])}</div>`;
      },
      forecast: () => {
        midBar.classList.remove('is-alert');
        renderForecast();
      },
      sunmoon: () => {
        midBar.classList.remove('is-alert');
        const now = new Date();
        const hasPos = settings.latitude !== null && settings.longitude !== null;
        const sunTimes = hasPos ? getSunTimes(now, settings.latitude, settings.longitude) : null;
        const sunriseText = sunTimes ? formatClockTime(sunTimes.sunrise) : '--:--';
        const sunsetText = sunTimes ? formatClockTime(sunTimes.sunset) : '--:--';
        const remaining = sunTimes ? daylightOrDarknessRemaining(sunTimes, now, settings.latitude, settings.longitude) : null;
        const remainingLabel = remaining ? remaining.label : 'Daylight Left';
        const remainingText = remaining ? remaining.text : '--';
        const isNight = remaining && remaining.label === 'Darkness Left';
        const moonPhaseText = moonPhaseName(getMoonPhase(now));
        midBar.innerHTML = `<div class="sunmoon-row">
          <div class="sm-stat">
            <svg class="sm-icon sm-icon-sunrise" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 18h18"/><path d="M6 18a6 6 0 0 1 12 0"/><path d="M12 4v4M6.5 8l1.8 1.8M17.5 8l-1.8 1.8"/><path d="M9 21l-1 -1M16 21l1-1"/></svg>
            <div class="sm-text"><div class="sm-val">${sunriseText}</div><div class="sm-lab">Sunrise</div></div>
          </div>
          <div class="sm-stat">
            <svg class="sm-icon sm-icon-sunset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 18h18"/><path d="M18 18a6 6 0 0 0-12 0"/><path d="M12 4v4M6.5 8l1.8 1.8M17.5 8l-1.8 1.8"/><path d="M4 21l1-1M21 21l-1-1"/></svg>
            <div class="sm-text"><div class="sm-val">${sunsetText}</div><div class="sm-lab">Sunset</div></div>
          </div>
          <div class="sm-stat">
            ${isNight
              ? '<svg class="sm-icon accent sm-icon-moon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 3a9 9 0 1 0 8 13 7 7 0 0 1-8-13z"/></svg>'
              : '<svg class="sm-icon accent sm-icon-daylight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>'}
            <div class="sm-text"><div class="sm-val">${remainingText}</div><div class="sm-lab">${remainingLabel}</div></div>
          </div>
          <div class="sm-stat">
            <svg class="sm-icon sm-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 3a9 9 0 1 0 8 13 7 7 0 0 1-8-13z"/></svg>
            <div class="sm-text"><div class="sm-val">${moonPhaseText}</div><div class="sm-lab">Moon Phase</div></div>
          </div>
        </div>`;
      },
    };

    // ---- Auto-rotation engine -- unchanged from the mockup. Alert is excluded from the
    // rotation entirely when currentTier === 'clear', takes a normal turn for a Watch/Heat/
    // Excessive Heat/generic alert, and fully pre-empts the rotation the instant a real
    // WARNING_TIERS tier goes active.
    const WARNING_TIERS = ['svrw', 'svrc', 'svrd', 'tor', 'pds', 'torE', 'ffw'];
    const ROTATION_ORDER = ['alert', 'params', 'chasers', 'day1', 'day2', 'forecast', 'sunmoon'];
    const DWELL_MS = { alert: 10000, params: 10000, chasers: 8000, day1: 10000, day2: 8000, forecast: 8000, sunmoon: 6000 };
    // Real threshold, set by updateSpcOutlook() once real risk levels are flowing (true whenever
    // either day is Slight or higher). Starts true so the card still takes its turn showing the
    // "awaiting data" placeholder before the first fetch resolves, rather than vanishing.
    let day23HasSomethingToShow = true;
    function cardEligible(key) {
      if (key === 'alert') return currentTier !== 'clear';
      if (key === 'day2') return day23HasSomethingToShow;
      return true;
    }
    function nextEligibleKey(afterKey) {
      const startIdx = Math.max(0, ROTATION_ORDER.indexOf(afterKey));
      for (let i = 1; i <= ROTATION_ORDER.length; i++) {
        const key = ROTATION_ORDER[(startIdx + i) % ROTATION_ORDER.length];
        if (cardEligible(key)) return key;
      }
      return afterKey;
    }
    function showRotationCard(key) {
      midButtons.forEach(b => b.classList.toggle('active', b.dataset.mid === key));
      animateSwap(midBar, () => {
        if (key !== 'alert') midBar.style.background = '';
        midContent[key]();
      });
    }
    let autoRotateOn = true;
    let rotationTimer = null;
    let rotationPausedForWarning = false;
    let pendingResumeKey = null;
    function scheduleAdvance(key, delayOverride) {
      clearTimeout(rotationTimer);
      const delay = delayOverride != null ? delayOverride : (DWELL_MS[key] || 8000);
      rotationTimer = setTimeout(() => advanceRotation(key), delay);
    }
    function advanceRotation(currentKey) {
      if (!autoRotateOn || rotationPausedForWarning) return;
      const next = nextEligibleKey(currentKey);
      showRotationCard(next);
      scheduleAdvance(next);
    }

    function scaleCanvas() {
      if (!settings.scaleToWindow) return;
      const scaleX = window.innerWidth / 1920;
      const scaleY = window.innerHeight / 1080;
      const scale = Math.min(scaleX, scaleY);
      document.getElementById('canvas').style.transform = 'scale(' + scale + ')';
    }

    // ---- Boot ----
    renderConditions();
    initRadarMap();
    if (settings.useLiveGps) {
      document.getElementById('condTitleText').textContent = 'Awaiting GPS feed...';
      updateGps();
      setInterval(updateGps, Math.max(2, settings.gpsPollSeconds) * 1000);
    } else {
      updateLocation();
      updateWeather();
      updateSurfaceObs();
      updateRadarSite();
      updateSpcOutlook();
      updateChaserData();
      updateForecast();
      updateStormIntel();
      updateNearbySevereWarnings();
    }
    updateAlertReal();
    updateViewerCount();
    setInterval(updateViewerCount, 15_000); // a live count is worth checking often; the fetch itself is cheap
    setInterval(updateLocation, Math.max(30, settings.pollSeconds) * 1000);
    setInterval(updateWeather, Math.max(30, settings.pollSeconds) * 1000);
    setInterval(updateSurfaceObs, Math.max(30, settings.pollSeconds) * 1000);
    setInterval(updateAlertReal, Math.max(30, settings.pollSeconds) * 1000);
    setInterval(updateSpcOutlook, Math.max(300, settings.pollSeconds) * 1000); // SPC reissues rarely -- no need to poll as often as weather/alerts
    setInterval(updateChaserData, Math.max(30, settings.pollSeconds) * 1000);
    setInterval(updateForecast, Math.max(600, settings.pollSeconds) * 1000); // forecast changes slowly -- no need to poll often
    setInterval(updateStormIntel, Math.max(300, settings.pollSeconds) * 1000); // HRRR updates hourly at best -- no need to poll as often as weather/alerts
    setInterval(updateNearbySevereWarnings, Math.max(90, settings.pollSeconds) * 1000);
    setInterval(radarModeTick, 700);
    setInterval(fetchRadarFrames, 120_000); // pick up new radar volume scans independent of site changes
    showRotationCard('alert');
    scheduleAdvance('alert');
    scaleCanvas();
    window.addEventListener('resize', scaleCanvas);
  </script>
</body>
</html>
